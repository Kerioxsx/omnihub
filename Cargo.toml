[workspace]
members = ["crates/omnihub-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.17.0"
edition = "2021"
license = "MIT"
authors = ["Kerioxsx"]
rust-version = "1.80"

[profile.dev.package."*"]
# Scanning millions of MFT records in an unoptimised dependency tree is
# painfully slow; optimise dependencies even in debug builds.
opt-level = 2

[profile.dev.package.omnihub-core]
opt-level = 1

[profile.release]
# Only OmniHub's own two crates are compiled by a release (the rest comes
# from the build cache); without cross-crate LTO and with more codegen units they
# build in a fraction of the time, for a binary that is barely different.
lto = false
codegen-units = 16
opt-level = 3
strip = "debuginfo"
panic = "unwind"
